name: Verify, build and publish the site

# This repository is private, so it cannot serve GitHub Pages on a free plan.
# The build is pushed to the public RyanColton/ReactDOOM repository,
# which serves https://ryancolton.github.io/ReactDOOM/ from its main branch.

on:
  push:
    branches: [react-presenter]
  pull_request:
    branches: [react-presenter]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify port and build browser app
        run: npm run verify
      - name: Add license and site readme to the build
        run: cp LICENSE.TXT dist/LICENSE.TXT && cp .github/site-README.md dist/README.md
      - name: Publish build to the public site repository
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: RyanColton/ReactDOOM
          publish_branch: main
          publish_dir: ./dist
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Publish build from ${{ github.sha }}'
